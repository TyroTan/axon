<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{.Title}} — Axon</title>
  <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2uodhCn9B6Lw7xdVuAEJXwr7AYE5yEHHZi" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/static/css/axon.css" />
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="logo">Axon</span>
      </div>
      <div class="sidebar-tracks">
        {{if .SidebarTracks}}
          {{range .SidebarTracks}}{{template "sidebar-track" .}}{{end}}
          <div class="sidebar-new"><a class="btn btn-ghost" href="/tracks/new">+ New Track</a></div>
        {{else}}
          <div hx-get="/api/sidebar" hx-trigger="load" hx-swap="outerHTML">
            <span class="muted" style="padding:12px 16px;display:block">Loading…</span>
          </div>
        {{end}}
      </div>
    </nav>

    <!-- Main -->
    <div class="main">

      <!-- Breadcrumb -->
      <header class="topbar">
        <nav class="breadcrumb" aria-label="breadcrumb">
          {{range $i, $crumb := .Breadcrumbs}}
            {{if $i}}<span class="bc-sep">›</span>{{end}}
            {{if $crumb.URL}}
              <a class="bc-item" href="{{$crumb.URL}}">{{$crumb.Label}}</a>
            {{else}}
              <span class="bc-item bc-current">{{$crumb.Label}}</span>
            {{end}}
          {{end}}
        </nav>
      </header>

      <!-- Page content -->
      <main class="content">
        {{embed}}
      </main>

    </div>
  </div>
</body>
</html>
